<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>运费大师</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>运费大师</h1>
      <p>美国 / 欧洲 / 加拿大 / 英国 / 澳大利亚 海运运费计算器（支持一票多箱）</p>
    </header>

    <nav class="tabs">
      <div class="tab active" data-tab="calc">运费计算</div>
      <div class="tab" data-tab="data">价格管理</div>
    </nav>

    <main class="content">
      <section id="panel-calc" class="panel active">
        <div class="form-row">
          <div class="form-group">
            <label for="group">目的地</label>
            <select id="group"></select>
          </div>
          <div class="form-group" id="zip-group">
            <label for="zip">美国邮编</label>
            <input type="text" id="zip" placeholder="例如：33195">
          </div>
          <div class="form-group" id="country-group" style="display:none;">
            <label for="country">目的国家 / 地区</label>
            <select id="country"></select>
          </div>
        </div>

        <div class="section-title">箱规</div>
        <div class="table-wrap">
          <table class="box-table">
            <thead>
              <tr>
                <th style="width:70px">箱号</th>
                <th>长 (cm)</th>
                <th>宽 (cm)</th>
                <th>高 (cm)</th>
                <th>实重 (kg)</th>
                <th style="width:100px">操作</th>
              </tr>
            </thead>
            <tbody id="boxes-body"></tbody>
          </table>
        </div>
        <div class="hint" id="box-hint">最多可添加 10 个箱规；每箱单独计算计费重与附加费，最后自动汇总。</div>

        <div class="actions">
          <button id="btn-add-box" class="btn btn-primary">+ 添加箱规</button>
          <button id="btn-clear-boxes" class="btn btn-danger">清空箱规</button>
          <button id="btn-clear-all" class="btn btn-danger">一键清空（箱规 + 目的地）</button>
          <button id="btn-calc" class="btn btn-primary">开始计算</button>
        </div>

        <div id="result" class="result-card" style="display:none;">
          <h3>计算结果</h3>
          <div class="result-grid" id="result-grid"></div>

          <div class="section-title">每箱明细</div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>箱号</th>
                  <th>箱规 (cm)</th>
                  <th>围长 (cm)</th>
                  <th>体积 (cm³)</th>
                  <th>实重 (kg)</th>
                  <th>体积重 (kg)</th>
                  <th>附加费</th>
                </tr>
              </thead>
              <tbody id="box-detail-body"></tbody>
              <tfoot id="box-detail-foot"></tfoot>
            </table>
          </div>

          <div id="surcharge-detail" class="surcharge-detail" style="display:none;"></div>
        </div>
      </section>

      <section id="panel-data" class="panel">
        <div class="section-title">通用计费参数</div>
        <div class="form-row">
          <div class="form-group">
            <label for="vol-divisor">体积重系数</label>
            <input id="vol-divisor" type="number" step="1" min="1">
            <div class="hint">计费重 = max(起重, ceil(长 × 宽 × 高 ÷ 系数))；起重取报价表第一栏。</div>
          </div>
          <div class="form-group">
            <button id="btn-save-vol" class="btn btn-primary">保存体积重系数</button>
          </div>
        </div>

        <div class="section-title">分国家 / 地区配置</div>
        <nav class="sub-tabs" id="group-tabs"></nav>
        <div id="group-panels"></div>

        <div class="actions">
          <button id="btn-reset" class="btn btn-danger">恢复默认数据</button>
        </div>
      </section>
    </main>
  </div>

  <div id="toast" class="toast"></div>

  <script src="renderer.js"></script>
</body>
</html>
